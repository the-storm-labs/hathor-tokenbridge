# The wallet-lib federator. Do not start this by hand: ops/walletlib-migration/migrate.sh switches
# to it, and `migrate.sh --rollback` switches back.
#
# migrate.sh reads the legacy federator's container and writes its whole configuration, under the
# new variable names, to walletlib-fed<order>.env next to this file (mode 600; ignored by git as
# **.env). It then adds COMPOSE_FILE=<this file> to the .env compose uses, so the usual
# `docker compose up -d` runs this file from then on. From .env this file only reads
# HATHOR_MULTISIG_ORDER (container name, port, volume) and, for alloy, the GRAFANA_CLOUD_* values.
# The legacy .env cannot feed the federator directly: its names, the xpub separator and two
# required values differ.
#
# The federator.
#
# What went away when the wallet moved in-process, and why:
#
#   rabbitmq        carried exactly one message type, wallet:new-tx, across a process boundary
#   init-rabbitmq   existed only to wait for rabbitmq
#   hathor-wallet   the wallet now runs inside the federator process
#
# What that costs: the multisig seed moves into the federator. It used to hold only an API key for
# the wallet container. That changes the blast radius of a federator compromise and is the one part
# of this migration that alters the bridge's risk profile.
#
# The federator process must not be restarted casually. Wallet storage is in memory, so every start
# rebuilds the entire Hathor history - minutes, not seconds. A reader failing does NOT restart it.

services:
  hathor-federator:
    image: toggera/hathor-tokenbridge:8ef17d5c436527cfd563a2fe86afc79dc67debd9
    container_name: hathor_tokenbridge_${HATHOR_MULTISIG_ORDER}
    restart: unless-stopped
    # Long enough for a cold start to finish rebuilding history before Docker gives up on a stop.
    stop_grace_period: 60s
    ports:
      - "500${HATHOR_MULTISIG_ORDER}:5000"
    volumes:
      - federator_db:/app/db
      - federator_db:/var/log
    # Written by migrate.sh from the legacy federator; every setting the federator reads is here.
    env_file:
      - "walletlib-fed${HATHOR_MULTISIG_ORDER}.env"

  prometheus:
    image: prom/prometheus:v2.49.0
    restart: unless-stopped
    depends_on:
      - hathor-federator
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 909${HATHOR_MULTISIG_ORDER}:9090

  promtail:
    image: grafana/promtail:2.0.0
    restart: unless-stopped
    depends_on:
      - hathor-federator
    volumes:
      - ./promtail/:/etc/promtail/
      - federator_db:/var/log
    command:
      - "--config.file=/etc/promtail/promtail-config_fed0${HATHOR_MULTISIG_ORDER}.yaml"

volumes:
  federator_db:
    name: hathor_federator_db_${HATHOR_MULTISIG_ORDER}
    driver: local
