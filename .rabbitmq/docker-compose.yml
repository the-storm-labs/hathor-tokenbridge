# The federator.
#
# What went away when the wallet moved in-process, and why:
#
#   rabbitmq        carried exactly one message type, wallet:new-tx, across a process boundary
#   init-rabbitmq   existed only to wait for rabbitmq
#   hathor-wallet   the wallet now runs inside the federator process
#
# What that costs: the multisig seed moves into the federator. It used to hold only an API key for
# the wallet container. That changes the blast radius of a federator compromise and is the one part
# of this migration that alters the bridge's risk profile.
#
# The federator process must not be restarted casually. Wallet storage is in memory, so every start
# rebuilds the entire Hathor history - minutes, not seconds. A reader failing does NOT restart it.

services:
  hathor-federator:
    image: toggera/hathor-tokenbridge:5477fbaa7c613d291e9f6252af69eae28d861f4e
    container_name: hathor_tokenbridge_${HATHOR_MULTISIG_ORDER}
    restart: unless-stopped
    # Long enough for a cold start to finish rebuilding history before Docker gives up on a stop.
    stop_grace_period: 60s
    ports:
      - "500${HATHOR_MULTISIG_ORDER}:5000"
    volumes:
      - federator_db:/app/db
      - federator_db:/var/log
    environment:
      # ---- EVM chain: Bridge / Federation / AllowTokens ----
      EVM_NAME: "${EVM_NETWORK}"
      EVM_CHAIN_ID: "${EVM_CHAIN_ID}"
      EVM_HOST: "${EVM_HOST}"
      EVM_BRIDGE_ADDRESS: "${BRIDGE_ADDRESS}"
      EVM_FEDERATION_ADDRESS: "${FEDERATION_ADDRESS}"
      EVM_ALLOW_TOKENS_ADDRESS: "${ALLOW_TOKENS_ADDRESS}"
      EVM_FROM_BLOCK: "${FROM_BLOCK}"

      # ---- State chain: the HathorFederation coordination contract ----
      STATE_CHAIN_ID: "${FEDERATION_CHAIN_ID}"
      STATE_CHAIN_HOST: "${HATHOR_STATE_CONTRACT_HOST_URL}"
      STATE_CONTRACT_ADDRESS: "${HATHOR_STATE_CONTRACT_ADDR}"
      STATE_FROM_BLOCK: "${FEDERATION_FROM_BLOCK}"
      STATE_CONFIRMATION_BLOCKS: "${FEDERATION_CONFIRMATION_BLOCKS}"

      # ---- Hathor ----
      HATHOR_NAME: "${HATHOR_NAME}"
      HATHOR_CHAIN_ID: "${HATHOR_CHAIN_ID}"
      HATHOR_NETWORK: "${HEADLESS_NETWORK}"
      HATHOR_FULLNODE_URL: "${HEADLESS_SERVER}"
      HATHOR_TX_MINING_URL: "${HEADLESS_TX_MINING_URL}"
      # The seed that used to live on the wallet container. See the note at the top of this file.
      HATHOR_SEED: "${HEADLESS_SEED_DEFAULT}"
      HATHOR_MULTISIG_PUBKEYS: "${HEADLESS_MULTISIG_SEED_DEFAULT_PUBKEYS}"
      HATHOR_NUM_SIGNATURES: "${HEADLESS_MULTISIG_SEED_DEFAULT_NUM_SIGNATURES}"
      HATHOR_MULTISIG_ORDER: "${HATHOR_MULTISIG_ORDER}"
      HATHOR_MIN_CONFIRMATIONS: "${HATHOR_MINIMUM_CONFIRMATIONS}"
      # Milliseconds, and it goes straight into a timer. The old HATHOR_INPUT_BLOCK_TTL example of
      # `1` meant one millisecond, which is no input lock at all.
      HATHOR_INPUT_LOCK_TTL_MS: "${HATHOR_INPUT_LOCK_TTL_MS:-1800000}"
      HATHOR_FROM_TIMESTAMP: "${HATHOR_LAST_TIMESTAMP}"

      # ---- Rollout switch ----
      # Set these two to run this whole tree against the wallet container you already have, before
      # moving onto the embedded library. Leave them unset for wallet-lib. /status reports which.
      HATHOR_HEADLESS_URL: "${HATHOR_HEADLESS_URL:-}"
      HATHOR_HEADLESS_API_KEY: "${HATHOR_HEADLESS_API_KEY:-}"

      # ---- Federator identity and runtime ----
      FEDERATOR_KEY: "${FEDERATOR_KEY}"
      # Optional: checked against the address derived from the key, never trusted on its own.
      FEDERATOR_ADDRESS: "${FEDERATOR_ADDRESS:-}"
      STORAGE_PATH: /app/db
      LOG_FILE: /var/log/federator.log

  prometheus:
    image: prom/prometheus:v2.49.0
    restart: unless-stopped
    depends_on:
      - hathor-federator
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 909${HATHOR_MULTISIG_ORDER}:9090

  promtail:
    image: grafana/promtail:2.0.0
    restart: unless-stopped
    depends_on:
      - hathor-federator
    volumes:
      - ./promtail/:/etc/promtail/
      - federator_db:/var/log
    command:
      - "--config.file=/etc/promtail/promtail-config_fed0${HATHOR_MULTISIG_ORDER}.yaml"

volumes:
  federator_db:
    name: hathor_federator_db_${HATHOR_MULTISIG_ORDER}
    driver: local
